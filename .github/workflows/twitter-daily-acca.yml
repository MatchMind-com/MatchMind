name: Twitter daily acca

# Posts today's AI value acca tweet to @Match_Mind_AI once per day.
#
# Schedule: TWO fires per day — 09:55 UTC and 12:38 UTC.
#   - Apr–Oct (BST): 10:55 / 13:38 UK time → first before lunchtime PL,
#     second after lunch as a fallback if 10:55 silently missed.
#   - Nov–Mar (GMT): 09:55 / 12:38 UK time → same logic.
#
# Why two fires (Fix B from the May 7 audit):
#   GitHub Actions silently DROPS scheduled cron runs during high-load
#   periods. We saw this kill IG posts on consecutive days. With two
#   fires at unrelated minutes the chance of GHA missing both on the
#   same day is statistically tiny.
#
# Why minute :55 + :38 (not :00):
#   GHA delays/skips top-of-hour crons most often (every scheduler
#   batches at :00). Off-hour minutes are far more reliable.
#
# Why this isn't double-posting:
#   The post-tonight-acca endpoint regenerates the acca on each call,
#   but it sends a fresh tweet either way. To prevent literal duplicate
#   tweets if both fires succeed, we'd need a Supabase tweet-dedupe
#   row — for now the second fire WILL post if the first one already
#   posted (acceptable: two related tweets are better than zero).
#   TODO: add daily_tweets dedupe table if duplicates become annoying.
#
# windowHours=18 catches every fixture from now through ~4am next day.
# Endpoint also auto-expands to 36h/72h if the slate is thin (Fix A).

on:
  schedule:
    - cron: '55 9 * * *'
    - cron: '38 12 * * *'
  workflow_dispatch:

concurrency:
  group: twitter-daily-acca
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit /api/admin/post-tonight-acca
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set on this repo"
            exit 1
          fi
          set -e
          response=$(curl -sS -X POST "https://www.matchmindcom.com/api/admin/post-tonight-acca" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 90 \
            -w "\nHTTP_STATUS:%{http_code}")
          status=$(echo "$response" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" -ge 400 ]; then
            echo "::error::Twitter acca post returned $status"
            exit 1
          fi
