name: Instagram daily acca

# Posts today's AI value acca to @match.mindai once per day.
#
# Schedule: 10:07 UTC daily.
#   - Apr–Oct (BST): 11:07 UK time → ~1.5 hrs before the earliest Premier
#     League slot (12:30 lunchtime kickoff Saturdays); ~3 hrs before Sunday
#     14:00 kickoffs; well before midweek evening fixtures.
#   - Nov–Mar (GMT): 10:07 UK time → 2.5 hrs of buffer before lunchtime PL.
# Posting this early lets the acca include EVERY game from lunchtime to late
# evening, not just the prime-time evening slate.
#
# Why :07 not :00? GitHub Actions delays or silently skips scheduled runs
# that fire at the top of an hour during high-load periods (top-of-hour is
# the most-used cron slot on the entire platform). 2026-05-02 the :00 slot
# missed the first scheduled fire entirely. Off-the-hour minutes are far
# more reliable. Twitter fires at :55 of the previous hour for the same
# reason — staggering also avoids both posts landing in the same queue.
#
# windowHours=18 (the endpoint default) catches every fixture from now
# through ~5am next day, so a 10:07 UTC post pulls in the entire day.

# Fix B (May 7 audit): added a second fire at 13:23 UTC as fallback. When
# GHA silently drops the 10:07 cron (it happens), the 13:23 fire still
# lands the post for the day. Statistically very unlikely both fires miss
# on the same day. The endpoint already auto-expands the window (Fix A)
# so the second fire still finds fixtures even later in the day.
on:
  schedule:
    - cron: '7 10 * * *'
    - cron: '23 13 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-daily-acca
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit /api/admin/post-instagram
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set on this repo"
            exit 1
          fi
          set -e
          response=$(curl -sS -X POST "https://www.matchmindcom.com/api/admin/post-instagram" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 90 \
            -w "\nHTTP_STATUS:%{http_code}")
          status=$(echo "$response" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" -ge 400 ]; then
            echo "::error::IG post returned $status"
            exit 1
          fi
